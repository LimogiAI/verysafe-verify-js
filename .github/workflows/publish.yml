# Publishes a tagged release to the public npm registry with provenance,
# through npm's trusted publishing (OpenID Connect from this workflow): no
# token is stored anywhere. The first version of the package is published by
# hand by the maintainer, signed in; trusted publishing is then switched on in
# the package's settings on npmjs.com for this repository and workflow.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - name: The tag must be the package's version, and that version not yet on npm
        id: check
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || { echo "::error::Tag ${GITHUB_REF_NAME} is not v${v}"; exit 1; }
          if npm view "@verysafe/verify@${v}" version >/dev/null 2>&1; then
            echo "::notice::@verysafe/verify@${v} is on npm already (the first version is published by hand); nothing to do."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'yes'
        run: npm publish --provenance --access public
